<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andy's Health</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      padding: 8px 0;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 18px;
    }

    /* Formulare & Eingaben */
    .form-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .form-group input, .form-group select {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* Schnell-Tracking Grid */
    .quick-track-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .action-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .action-card:active {
      transform: scale(0.97);
    }

    .action-card .icon {
      font-size: 32px;
      display: block;
      margin-bottom: 6px;
    }

    .action-card span {
      font-size: 14px;
      font-weight: 600;
    }

    /* Sport-Aktivitäten Grid */
    .activity-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .activity-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0f172a;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .activity-btn:active {
      transform: scale(0.95);
      background-color: #1e293b;
    }

    .activity-btn .icon {
      font-size: 26px;
      margin-bottom: 4px;
    }

    .activity-btn span.label {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }

    /* Huawei Health Style Erweiterung */
    .more-sports-box {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 8px;
    }

    .more-sports-box h3 {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 10px 0;
    }

    /* Einträge korrigieren */
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-actions {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: white;
    }

    .btn-edit { background: var(--primary); }
    .btn-delete { background: var(--danger); }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <div class="header">
      <h1>Andy's Health 📊</h1>
    </div>

    <!-- Profil & Angaben -->
    <div class="card">
      <h2>👤 Mein Profil</h2>
      <div class="form-group">
        <input type="number" id="userHeight" placeholder="Größe (cm)" onchange="saveProfile()">
        <input type="number" id="userAge" placeholder="Alter" onchange="saveProfile()">
      </div>
    </div>

    <!-- Gewicht stracken -->
    <div class="card">
      <h2>⚖️ Gewicht tracken</h2>
      <div class="form-group">
        <input type="number" id="weightInput" step="0.1" placeholder="Neues Gewicht (kg)">
        <button class="btn-main" style="width: auto; padding: 0 16px;" onclick="addWeight()">Speichern</button>
      </div>
      <div id="currentWeightDisplay" style="color: var(--text-muted); font-size: 14px; text-align: center; margin-top: 6px;"></div>
    </div>

    <!-- Schnell-Tracking (Wasser & Mahlzeit) -->
    <div class="card">
      <h2>⚡ Schnell-Tracking</h2>
      <div class="quick-track-grid">
        <div class="action-card" onclick="addLog('Wasser', '+250ml')">
          <span class="icon">💧</span>
          <span>Wasser (+250ml)</span>
        </div>
        <div class="action-card" onclick="openCamera()">
          <span class="icon">📸</span>
          <span>Mahlzeit (KI)</span>
        </div>
      </div>
    </div>

    <!-- Aktivität tracken -->
    <div class="card">
      <h2>🏃‍♂️ Aktivität tracken</h2>
      
      <!-- Schnellzugriff -->
      <div class="activity-grid">
        <button class="activity-btn" onclick="addLog('Sport', 'Slow Jogging 🏃‍♂️')">
          <span class="icon">🏃‍♂️</span>
          <span class="label">Slow Jogging</span>
        </button>

        <button class="activity-btn" onclick="addLog('Sport', 'Paddel-Tennis 🎾')">
          <span class="icon">🎾</span>
          <span class="label">Paddel-Tennis</span>
        </button>

        <button class="activity-btn" onclick="addLog('Sport', 'Laufen 🏃')">
          <span class="icon">🏃</span>
          <span class="label">Laufen</span>
        </button>

        <button class="activity-btn" onclick="addLog('Sport', 'Skifahren ⛷️')">
          <span class="icon">⛷️</span>
          <span class="label">Skifahren</span>
        </button>

        <button class="activity-btn" onclick="addLog('Sport', 'Ergometer 🚴‍♂️')">
          <span class="icon">🚴‍♂️</span>
          <span class="label">Ergometer</span>
        </button>

        <button class="activity-btn" onclick="addLog('Sport', 'Freeletics 🤸‍♂️')">
          <span class="icon">🤸‍♂️</span>
          <span class="label">Freeletics</span>
        </button>
      </div>

      <!-- Weitere Sportarten (Huawei Health Style) -->
      <div class="more-sports-box">
        <h3>➕ Weitere Sportart hinzufügen</h3>
        <div class="form-group">
          <select id="moreSportsSelect">
            <option value="🏊‍♂️ Schwimmen">🏊‍♂️ Schwimmen</option>
            <option value="🥾 Wandern">🥾 Wandern</option>
            <option value="🏋️‍♂️ Krafttraining">🏋️‍♂️ Krafttraining</option>
            <option value="🚴‍♀️ Radfahren (Draußen)">🚴‍♀️ Radfahren (Draußen)</option>
            <option value="🏸 Badminton">🏸 Badminton</option>
            <option value="🧘‍♂️ Yoga">🧘‍♂️ Yoga</option>
            <option value="🧘‍♀️ Pilates">🧘‍♀️ Pilates</option>
            <option value="🏓 Tischtennis">🏓 Tischtennis</option>

            <option value="🥊 Boxen">🥊 Boxen</option>
            <option value="🛼 Inline-Skating">🛼 Inline-Skating</option>
            <option value="🏋️‍♀️ Crossfit">🏋️‍♀️ Crossfit</option>
            <option value="🏄‍♂️ Surfen">🏄‍♂️ Surfen</option>
            <option value="🧗‍♂️ Klettern">🧗‍♂️ Klettern</option>
            <option value="🕺 Tanzen">🕺 Tanzen</option>
            <option value="⚽ Fußball">⚽ Fußball</option>
            <option value="🏀 Basketball">🏀 Basketball</option>
            <option value="🏐 Volleyball">🏐 Volleyball</option>
          </select>
        </div>
        <div class="form-group">
          <input type="number" id="sportDuration" placeholder="Dauer in Min (z.B. 45)">
          <button class="btn-main" style="width: auto; padding: 0 16px;" onclick="addCustomSport()">Tracken</button>
        </div>
      </div>

    </div>

    <!-- Protokoll / Korrektur-Bereich -->
    <div class="card">
      <h2>✏️ Einträge verwalten & korrigieren</h2>
      <div id="logList"></div>
    </div>

  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('andys_health_logs')) || [];

    // Profil laden & speichern
    function loadProfile() {
      const height = localStorage.getItem('andys_health_height') || '';
      const age = localStorage.getItem('andys_health_age') || '';
      const weight = localStorage.getItem('andys_health_weight') || '--';

      document.getElementById('userHeight').value = height;
      document.getElementById('userAge').value = age;
      document.getElementById('currentWeightDisplay').innerText = `Aktuelles Gewicht: ${weight} kg`;
    }

    function saveProfile() {
      const height = document.getElementById('userHeight').value;
      const age = document.getElementById('userAge').value;
      
      localStorage.setItem('andys_health_height', height);
      localStorage.setItem('andys_health_age', age);
    }

    function addWeight() {
      const weightVal = document.getElementById('weightInput').value;
      if (!weightVal) return;

      localStorage.setItem('andys_health_weight', weightVal);
      addLog('Gewicht', `${weightVal} kg`);
      document.getElementById('weightInput').value = '';
      loadProfile();
    }

    // Zusätzliche Sportart hinzufügen
    function addCustomSport() {
      const sportSelect = document.getElementById('moreSportsSelect');
      const durationInput = document.getElementById('sportDuration');
      
      const sportName = sportSelect.value;
      const duration = durationInput.value;

      let logText = sportName;
      if (duration) {
        logText += ` (${duration} Min)`;
      }

      addLog('Sport', logText);
      durationInput.value = '';
    }

    // Protokoll-Verwaltung
    function renderLogs() {
      const container = document.getElementById('logList');
      container.innerHTML = '';

      if (logs.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Noch keine Einträge heute.</p>';
        return;
      }

      logs.forEach((log, index) => {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div>
            <strong>${log.kat}:</strong> ${log.text}
          </div>
          <div class="log-actions">
            <button class="btn-sm btn-edit" onclick="editLog(${index})">✏️ Bearbeiten</button>
            <button class="btn-sm btn-delete" onclick="deleteLog(${index})">🗑️</button>
          </div>
        `;
        container.appendChild(item);
      });

      localStorage.setItem('andys_health_logs', JSON.stringify(logs));
    }

    function addLog(kat, text) {
      logs.unshift({ kat, text });
      renderLogs();
    }

    function editLog(index) {
      const newText = prompt("Eintrag korrigieren:", logs[index].text);
      if (newText !== null && newText.trim() !== "") {
        logs[index].text = newText;
        renderLogs();
      }
    }

    function deleteLog(index) {
      if (confirm("Eintrag löschen?")) {
        logs.splice(index, 1);
        renderLogs();
      }
    }

    function openCamera() {
      alert("Kamera/Foto-Analyse wird geöffnet... 📸");
    }

    // Initialisierung
    loadProfile();
    renderLogs();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andy's Health</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      padding: 8px 0;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    /* Kachel-Navigation am Startbildschirm */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .nav-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .nav-card:active {
      transform: scale(0.96);
    }

    .nav-card .icon {
      font-size: 32px;
      display: block;
      margin-bottom: 6px;
    }

    .nav-card .title {
      font-weight: 600;
      font-size: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    /* Modal / Formular-Bereich */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      box-sizing: border-box;
      font-size: 15px;
    }

    button.btn-primary {
      background: var(--primary);
      border: none;
      font-weight: bold;
      margin-top: 16px;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    /* Einträge verwalten & korrigieren */
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-actions {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
      margin: 0;
    }

    .btn-edit { background: var(--primary); }
    .btn-delete { background: var(--danger); }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="header">
      <h1>Andy's Health 📊</h1>
    </div>

    <!-- Startbildschirm Navigation -->
    <div class="dashboard-grid">
      <div class="nav-card" onclick="openModal('profilModal')">
        <span class="icon">👤</span>
        <span class="title">Profil</span>
      </div>
      <div class="nav-card" onclick="openModal('sportModal')">
        <span class="icon">🏃‍♂️</span>
        <span class="title">Sport</span>
      </div>
      <div class="nav-card" onclick="openModal('ernaehrungModal')">
        <span class="icon">🥗</span>
        <span class="title">Ernährung</span>
      </div>
      <div class="nav-card" onclick="quickWater()">
        <span class="icon">💧</span>
        <span class="title">Wasser (+250ml)</span>
      </div>
    </div>

    <!-- Tages-Protokoll mit Manuelle Korrektur -->
    <div class="card">
      <h2>Einträge verwalten & korrigieren</h2>
      <div id="logList">
        <!-- Dynamische Einträge -->
      </div>
    </div>

  </div>

  <!-- MODAL: Profil -->
  <div id="profilModal" class="modal">
    <div class="modal-content">
      <h2>Profil anpassen</h2>
      <label>Gewicht (kg):</label>
      <input type="number" id="userWeight" value="80">
      <label>Ziel Kalorien (kcal):</label>
      <input type="number" id="userCalGoal" value="2200">
      <button class="btn-primary" onclick="closeModal('profilModal')">Speichern</button>
    </div>
  </div>

  <!-- MODAL: Sport -->
  <div id="sportModal" class="modal">
    <div class="modal-content">
      <h2>Sport eintragen</h2>
      <select id="sportType">
        <option value="Slow Jogging 🏃‍♂️">Slow Jogging 🏃‍♂️</option>
        <option value="Paddel-Tennis 🎾">Paddel-Tennis 🎾</option>
        <option value="Laufen 🏃">Laufen 🏃</option>
        <option value="Skifahren ⛷️">Skifahren ⛷️</option>
        <option value="Ergometer 🚴‍♂️">Ergometer 🚴‍♂️</option>
        <option value="Freeletics 🤸‍♂️">Freeletics 🤸‍♂️</option>
      </select>
      <input type="number" id="sportDauer" placeholder="Dauer in Minuten">
      <button class="btn-primary" onclick="addLog('Sport', getSportVal())">Hinzufügen</button>
      <button class="btn-secondary" onclick="closeModal('sportModal')">Abbrechen</button>
    </div>
  </div>

  <!-- MODAL: Ernährung -->
  <div id="ernaehrungModal" class="modal">
    <div class="modal-content">
      <h2>Ernährung eintragen</h2>
      <input type="text" id="foodName" placeholder="Mahlzeit (z. B. Mittagessen)">
      <input type="number" id="foodCal" placeholder="Kalorien (kcal)">
      <button class="btn-primary" onclick="addErnaehrung()">Hinzufügen</button>
      <button class="btn-secondary" onclick="closeModal('ernaehrungModal')">Abbrechen</button>
    </div>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('andys_health_logs')) || [];

    function renderLogs() {
      const container = document.getElementById('logList');
      container.innerHTML = '';

      if (logs.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Noch keine Einträge heute.</p>';
        return;
      }

      logs.forEach((log, index) => {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div>
            <strong>${log.kat}:</strong> ${log.text}
          </div>
          <div class="log-actions">
            <button class="btn-sm btn-edit" onclick="editLog(${index})">✏️ Edit</button>
            <button class="btn-sm btn-delete" onclick="deleteLog(${index})">🗑️</button>
          </div>
        `;
        container.appendChild(item);
      });

      localStorage.setItem('andys_health_logs', JSON.stringify(logs));
    }

    function addLog(kat, text) {
      logs.unshift({ kat, text });
      renderLogs();
      closeAllModals();
    }

    function quickWater() {
      addLog('Wasser', '+250 ml');
    }

    function getSportVal() {
      const type = document.getElementById('sportType').value;
      const dauer = document.getElementById('sportDauer').value || '30';
      return `${type} (${dauer} Min)`;
    }

    function addErnaehrung() {
      const name = document.getElementById('foodName').value || 'Mahlzeit';
      const cal = document.getElementById('foodCal').value || '0';
      addLog('Ernährung', `${name} - ${cal} kcal`);
    }

    function editLog(index) {
      const newText = prompt("Eintrag manuell korrigieren:", logs[index].text);
      if (newText !== null) {
        logs[index].text = newText;
        renderLogs();
      }
    }

    function deleteLog(index) {
      if (confirm("Diesen Eintrag löschen?")) {
        logs.splice(index, 1);
        renderLogs();
      }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function closeAllModals() {
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    renderLogs();
  </script>
</body>
</html>
